<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản trị | Top One VN</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #0a2f77; }
    :root { --gg-warning-height: 25px; } /* đo thật lúc build trang này; Google đổi giao diện thì sửa số này */

    .cms-viewport { position: fixed; inset: 0; overflow: hidden; }
    .cms-frame {
      position: absolute; left: 0; border: 0; display: block;
      top: calc(var(--gg-warning-height) * -1);
      width: 100%; height: calc(100% + var(--gg-warning-height));
      background: #fff;
    }

    .cms-status {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: #0a2f77; color: #fff;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    .cms-status[hidden] { display: none; }
    .cms-spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .25); border-top-color: #fff;
      animation: cms-spin .8s linear infinite;
    }
    @keyframes cms-spin { to { transform: rotate(360deg); } }
    .cms-status a { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="cms-viewport" id="cmsViewport"></div>

  <div class="cms-status" id="cmsStatus">
    <div class="cms-spinner" aria-hidden="true"></div>
    <p id="cmsStatusText">Đang tải trang quản trị…</p>
  </div>

  <script>
    // Dán URL quản trị đã deploy vào đây (xem GAS.md mục XI).
    var CMS_URL = "https://script.google.com/macros/s/AKfycbxPCSXahsjvkQ3sYYXDNWpk2MEGhiONTq2WPJstFrIYf7-PzZgPhDvxCt3ytll7hZeMZA/exec";

    var status = document.getElementById("cmsStatus");
    var statusText = document.getElementById("cmsStatusText");
    var loaded = false;

    // BUG THẬT đã gặp (11/09/2026): <iframe> khai sẵn trong HTML KHÔNG có src sẽ tự bắn 1 sự
    // kiện "load" cho tài liệu rỗng about:blank NGAY LÚC parser chèn nó vào DOM - trước khi
    // script này kịp gán src thật. Script gắn listener rồi mới gán frame.src = CMS_URL vẫn ăn
    // trúng sự kiện "load" rỗng đó (event được xếp hàng đợi, bắn ra ngay sau khi script đồng bộ
    // chạy xong) => loaded bị set true SAI, bộ đếm 12 giây bị vô hiệu hoá ngay từ đầu, trong khi
    // nội dung thật (URL tổ chức Google Workspace) vẫn đang treo "pending" phía sau - người dùng
    // thấy y hệt "treo vĩnh viễn, không có lối thoát". Vá triệt để: tự TẠO iframe bằng JS và gán
    // src TRƯỚC khi chèn vào DOM - không có bước "chèn rỗng rồi gán src sau" nên không có sự
    // kiện "load" rỗng nào để ăn nhầm; sự kiện "load" đầu tiên (và duy nhất) chắc chắn ứng với
    // CMS_URL thật.
    var frame = document.createElement("iframe");
    frame.className = "cms-frame";
    frame.title = "Quản trị Top One VN";
    frame.addEventListener("load", function () {
      // Sự kiện "load" vẫn bắn dù nội dung khác origin (googleusercontent.com) - đủ để biết
      // "đã tải xong", dù không đọc được bên trong.
      loaded = true;
      status.hidden = true;
    });
    frame.src = CMS_URL;
    document.getElementById("cmsViewport").appendChild(frame);

    setTimeout(function () {
      if (loaded) return;
      // Treo quá lâu (thường do đang đăng nhập Google Workspace tổ chức, xem
      // static-site-build.md mục 6a) — chỉ đường sang trang dự phòng.
      statusText.innerHTML =
        'Không tải được trang quản trị.<br />' +
        '<a href="/admin-gas/">Mở bằng cách khác</a>';
    }, 12000);
  </script>
</body>
</html>
